name: Context — missile and craft action audit
on:
  push:
    branches: [arena/10158ad9-aimods]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
concurrency:
  # Skipped/evidence pushes must never cancel the other audit still running.
  group: context-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[context]') || github.event_name == 'workflow_dispatch') && 'active' || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[context]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: pulse
      QA_PREFIX: context
      QA_INSTALLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Isolate disposable runtime
        run: |
          echo "MC_RUNS=$RUNNER_TEMP/mc-runs" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          mkdir -p verification/logs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gradle-home
          key: forge-47.4.23-gradle8.8-v1
      - name: Display and real audio capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool x11-utils ffmpeg pulseaudio libegl1 libgl1-mesa-dri libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libflite1
          pip install minecraft-launcher-lib==7.1 numpy==2.2.6 soundfile==0.13.1 pillow
          Xvfb :99 -screen 0 1400x1000x24 -nolisten tcp > verification/logs/xvfb.log 2>&1 &
          python - <<'PY'
          import subprocess,time
          end=time.monotonic()+30
          while subprocess.run(['xdpyinfo','-display',':99'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              if time.monotonic()>end: raise RuntimeError('X11 not ready')
              time.sleep(.1)
          PY
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa rate=48000
          pactl set-default-sink qa
          pactl set-default-source qa.monitor
          pactl info > verification/logs/pulse-info.log
      - name: Static and protocol tests
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_stage1c.py
          python tools/check_volumetric.py
      - name: Build release JAR
        id: build
        working-directory: mods/aiarsenal
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee ../../verification/logs/build.log
      - name: Minecraft GameTests
        run: python tools/verify_game.py gametest 2>&1 | tee verification/logs/gametest-driver.log
      - name: Contextual launchpad, craft, cannon and Javelin actions in installed Minecraft
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/verify_context_game.py 2>&1 | tee verification/logs/context-driver.log
      - name: Archive evidence and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-evidence
          path: |
            verification/
            mods/aiarsenal/build/libs/*.jar
      - name: Preserve incremental evidence even on failure
        if: always()
        run: |
          DEST="reports/context/run-${GITHUB_RUN_ID}"
          SHOTS="shots/aiarsenal/context/run-${GITHUB_RUN_ID}"
          mkdir -p "$DEST" "$SHOTS"
          cp verification/logs/* "$DEST/"
          if [ -f "$DEST/context-gameplay.json" ]; then python tools/report_context.py "$DEST"; fi
          python - <<'PYCOMPRESS'
          import gzip,hashlib,json,os
          from pathlib import Path
          dest=Path('reports/context')/('run-'+os.environ['GITHUB_RUN_ID'])
          records=[]
          for path in dest.glob('*.log'):
              if path.stat().st_size<250000: continue
              raw=path.read_bytes()
              path.with_suffix('.log.gz').write_bytes(gzip.compress(raw,mtime=0))
              records.append(dict(file=path.name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
              path.unlink()
          (dest/'compressed-logs.json').write_text(json.dumps(records,indent=2)+'\n')
          PYCOMPRESS
          if [ -d verification/shots ]; then find verification/shots -name '*.png' -exec cp {} "$SHOTS/" \;; fi
          printf 'Source: %s\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$DEST/provenance.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/context shots/aiarsenal/context
          git commit -m '[context-evidence] Installed-Minecraft contextual results'
          git fetch origin arena/10158ad9-aimods
          git rebase FETCH_HEAD
          git push origin HEAD:arena/10158ad9-aimods
