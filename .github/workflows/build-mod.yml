name: Build AI Arsenal jar

on:
  push:
    branches: [ "arena/**" ]
    paths:
      - "mods/aiarsenal/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build mod jar
        working-directory: mods/aiarsenal
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aiarsenal-jar
          path: mods/aiarsenal/build/libs/*.jar
          if-no-files-found: error
