name: GameTests — fast regression diagnostics
on:
  push:
    branches: [arena/10158ad9-aimods]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: gametest-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[gametest]') || github.event_name == 'workflow_dispatch') && 'active' || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[gametest]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Isolate disposable runtime
        run: |
          echo "MC_RUNS=$RUNNER_TEMP/mc-runs" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          mkdir -p verification/logs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gradle-home
          key: forge-47.4.23-gradle8.8-v1
      - name: Minecraft GameTests
        run: python tools/verify_game.py gametest 2>&1 | tee verification/logs/gametest-driver.log
      - name: Preserve diagnostics even on failure
        if: always()
        run: |
          DEST="reports/gametest/run-${GITHUB_RUN_ID}"
          python tools/gametest_checkpoint.py verification/logs/gametest.log "$DEST" "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m '[gametest-evidence] Standalone required-test diagnostics'
          git fetch origin arena/10158ad9-aimods
          git rebase FETCH_HEAD
          git push origin HEAD:arena/10158ad9-aimods
      - name: Archive full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-evidence
          path: verification/logs/
