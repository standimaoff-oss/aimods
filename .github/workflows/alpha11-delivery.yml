name: Release — upload verified alpha.11 bytes
on:
  push:
    branches: [arena/10158ad9-aimods]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[upload-alpha11]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/10158ad9-aimods
          fetch-depth: 0
      - name: Check all four audits, all shader jobs and reviewed installed bytes
        id: acceptance
        run: |
          DEST="reports/publication/run-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          python -m unittest discover -s tools -p 'test_reload_shader_delivery.py'
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          candidate=json.loads(Path('reports/reload-shaders/candidate.json').read_text())
          dest=Path('reports/publication')/('run-'+os.environ['GITHUB_RUN_ID'])
          for run in candidate['runs'].values():
              result=subprocess.check_output(['gh','run','view',str(run),'--json','headSha,status,conclusion,jobs'])
              (dest/f'{run}.json').write_bytes(result)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('artifact_run='+str(candidate['runs']['catalogue'])+'\n')
          PY
          python tools/verify_reload_shader_delivery.py reports/reload-shaders/candidate.json "$DEST" reports > "$DEST/acceptance.json"
      - uses: actions/download-artifact@v4
        with:
          name: catalogue-evidence
          run-id: ${{ steps.acceptance.outputs.artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-artifact
      - name: Verify downloaded bytes against the installed and reviewed candidate
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path('reports/publication')/('run-'+os.environ['GITHUB_RUN_ID'])
          acceptance=json.loads((folder/'acceptance.json').read_text())
          jars=list((Path(os.environ['RUNNER_TEMP'])/'verified-artifact').rglob('aiarsenal-1.0.1-alpha.11.jar'))
          assert len(jars)==1,jars
          assert hashlib.sha256(jars[0].read_bytes()).hexdigest()==acceptance['sha256'],'artifact differs from tested bytes'
          (folder/'SHA256SUMS').write_text(acceptance['sha256']+'  '+jars[0].name+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('VERIFIED_JAR='+str(jars[0])+'\n')
          PY
      - name: Upload only to the existing private draft, then verify remote bytes
        run: |
          DEST="reports/publication/run-${GITHUB_RUN_ID}"
          gh release view v1.0.1-alpha.11 --json isDraft,tagName > "$DEST/before-upload.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          state=json.loads((Path('reports/publication')/('run-'+os.environ['GITHUB_RUN_ID'])/'before-upload.json').read_text())
          assert state['isDraft'] is True and state['tagName']=='v1.0.1-alpha.11','refuse to overwrite a published release'
          PY
          gh release upload v1.0.1-alpha.11 "$VERIFIED_JAR" "$DEST/SHA256SUMS" --clobber 2>&1 | tee "$DEST/upload.log"
          gh release view v1.0.1-alpha.11 --json tagName,isDraft,assets,url > "$DEST/release.json"
          gh release download v1.0.1-alpha.11 --pattern aiarsenal-1.0.1-alpha.11.jar --dir "$RUNNER_TEMP/release-roundtrip"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path('reports/publication')/('run-'+os.environ['GITHUB_RUN_ID'])
          expected=json.loads((folder/'acceptance.json').read_text())['sha256']
          jar=Path(os.environ['RUNNER_TEMP'])/'release-roundtrip/aiarsenal-1.0.1-alpha.11.jar'
          actual=hashlib.sha256(jar.read_bytes()).hexdigest()
          assert actual==expected,'uploaded release differs from tested bytes'
          (folder/'remote-byte-verification.json').write_text(json.dumps(dict(result='PASS',sha256=actual,bytes=jar.stat().st_size),indent=2)+'\n')
          PY
      - name: Preserve delivery evidence even on failure
        if: always()
        run: |
          DEST="reports/publication/run-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_evidence.py "$DEST"/*
