name: build-aiarsenal

# Builds the military mod on GitHub runners, which can reach Forge Maven (the sandbox cannot).
# Result: the jar is attached to the run as the artifact "aiarsenal-jar".

on:
  push:
    branches: [arena/79508f87-aimods, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mods/aiarsenal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aiarsenal-jar
          path: mods/aiarsenal/build/libs/*.jar
          if-no-files-found: error
