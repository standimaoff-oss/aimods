name: Stage 1 verified preview
on:
  push:
    branches: [arena/10158ad9-aimods]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stage1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[deliver-stage1]') && !contains(github.event.head_commit.message, '[stage1-evidence]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      DISPLAY: ':99'
      ALSOFT_DRIVERS: 'null'
    steps:
      - name: Isolate Minecraft and Gradle caches
        run: |
          echo "MC_RUNS=$RUNNER_TEMP/mc-runs" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Python and software display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool libgl1 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libflite1
          pip install bpy==4.2.23 pillow
      - name: Export real Blender models and check GLBs
        run: |
          mkdir -p verification/logs
          python tools/blender/weapons_r22.py --only-ppsh 2>&1 | tee verification/logs/blender.log
          python tools/check_ppsh.py 2>&1 | tee verification/logs/glb-tests.log
      - name: Build Forge mod
        working-directory: mods/aiarsenal
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee ../../verification/logs/build.log
      - name: Minecraft GameTests
        run: |
          python tools/verify_game.py gametest
      - name: Minecraft client screenshots
        run: |
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > verification/logs/xvfb.log 2>&1 &
          python tools/verify_game.py client
      - name: Save QA evidence in the working branch
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p reports/stage1/review2 shots/aiarsenal/stage1a-review2
          cp verification/logs/{glb-tests,gametest,rcon,client,server}.log reports/stage1/review2/
          cp verification/shots/*.png shots/aiarsenal/stage1a-review2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stage1/review2 shots/aiarsenal/stage1a-review2
          git diff --cached --quiet || git commit -m '[stage1-evidence] Record verified shooting, reload and F2 screenshots'
          git push origin HEAD:arena/10158ad9-aimods
      - name: Attach corrected screenshots without removing previous evidence
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload stage1a-1.0.1-alpha.1 verification/shots/*.png
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-evidence
          path: |
            verification/
            models/ppsh41.blend
            mods/aiarsenal/src/main/resources/assets/aiarsenal/models/glb/ppsh41.glb
            mods/aiarsenal/src/main/resources/assets/aiarsenal/models/glb/mag_ppsh.glb
            mods/aiarsenal/build/libs/*.jar
          if-no-files-found: error
