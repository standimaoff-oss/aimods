name: Build AI Arsenal JAR
on:
  push:
    branches:
      - arena/10158ad9-aimods
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-jar]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mods/aiarsenal/**/*.gradle*
            mods/aiarsenal/gradle/wrapper/gradle-wrapper.properties
      - name: Build mod JAR
        working-directory: mods/aiarsenal
        run: ./gradlew build --no-daemon --stacktrace
      - name: Record artifact checksums and source revision
        if: success()
        working-directory: mods/aiarsenal
        run: |
          set -euo pipefail
          mkdir -p ../../verification
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          main_jar="build/libs/aiarsenal-${version}.jar"
          if [[ -z "$version" || ! -s "$main_jar" ]]; then
            echo "Expected built JAR not found: $main_jar" >&2
            exit 1
          fi
          (cd build/libs && sha256sum "aiarsenal-${version}.jar") > ../../verification/SHA256SUMS
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > ../../verification/provenance.txt
      - name: Upload JAR and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiarsenal-jar-${{ github.run_number }}
          path: |
            mods/aiarsenal/build/libs/*.jar
            verification/SHA256SUMS
            verification/provenance.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish versioned pre-release
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' mods/aiarsenal/gradle.properties)"
          tag="v${version}"
          jar="mods/aiarsenal/build/libs/aiarsenal-${version}.jar"
          test -s "$jar"
          test -s verification/SHA256SUMS
          test -s verification/provenance.txt
          notes="$(cat <<EOF
          Alpha pre-release for Minecraft 1.20.1, Forge 47.4.23 and Java 17.

          Includes the British Mark I, Gewehr 98 and 57 mm ammunition. The README's screenshots are authentic F2 captures from a disposable test world; they demonstrate the in-game models but do not claim comprehensive gameplay verification. Back up worlds before installing or updating.

          Source commit: ${SOURCE_SHA}
          Build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          gh release create "$tag" "$jar" verification/SHA256SUMS verification/provenance.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "AI Arsenal ${version} — WWI content and in-game previews" \
            --notes "$notes" \
            --prerelease
