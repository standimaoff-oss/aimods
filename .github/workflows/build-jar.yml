name: Build AI Arsenal JAR
on:
  push:
    branches:
      - arena/10158ad9-aimods
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-jar]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mods/aiarsenal/**/*.gradle*
            mods/aiarsenal/gradle/wrapper/gradle-wrapper.properties
      - name: Build mod JAR
        working-directory: mods/aiarsenal
        run: |
          mkdir -p ../../verification/logs
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ../../verification/logs/build.log
      - name: Record artifact checksums and source revision
        if: success()
        working-directory: mods/aiarsenal
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo 'Gradle completed but produced no JAR files.' >&2
            exit 1
          fi
          sha256sum "${jars[@]}" > ../../verification/SHA256SUMS
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > ../../verification/provenance.txt
      - name: Upload JAR and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiarsenal-jar-${{ github.run_number }}
          path: |
            mods/aiarsenal/build/libs/*.jar
            verification/logs/build.log
            verification/SHA256SUMS
            verification/provenance.txt
          if-no-files-found: warn
          retention-days: 14
